# .github/workflows/nav-drift.yml
#
# where: runs on GitHub, weekly, and reaches only the public website.
# what: compares ui/public/site-nav.js against the copy danielsolves.ai is serving,
#   and opens an issue when they have drifted apart.
# why: that file is a copy. The original lives in the portfolio repository, and
#   nothing connects the two. A change there is invisible here until somebody
#   notices the demo is wearing last season's navigation, which is exactly the
#   failure mode that let the README GIF go stale for a month.
#
# It compares against the deployed site rather than the other repository, and that is
# the whole trick. Reading a private repository from here would need a token with
# write access to both, which is a large permission to hand out for a cosmetic check.
# The site serves the same file publicly, so no credential is involved at all.
#
# Two consequences worth stating. It compares against what is DEPLOYED, not what is
# merged, so a change sitting unreleased in the portfolio will not be reported until
# it goes live, which is the right moment anyway. And if danielsolves.ai is down the
# job says so and stops, rather than claiming a match it could not check.
#
# Deliberately not a required check and deliberately not on pull requests. A cosmetic
# mismatch must never stand between a fix and production, and a check that can be
# broken by an unrelated site being unreachable has no business blocking a merge.

name: Nav drift

on:
  schedule:
    # Monday morning, after the Dependabot run, so the week's chores arrive together.
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare our copy with the one the site serves
        id: compare
        run: |
          set -euo pipefail
          ours=ui/public/site-nav.js
          theirs=$(mktemp)

          if ! curl --fail --silent --show-error --max-time 20 \
               https://danielsolves.ai/site-nav.js -o "$theirs"; then
            echo "danielsolves.ai did not answer, so nothing was compared" >&2
            echo 'state=unreachable' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # An empty or absurdly small answer is a proxy error page, not the file.
          # Reporting drift against that would be a false alarm every time the site
          # hiccups, and false alarms are how a check stops being read.
          bytes=$(wc -c < "$theirs")
          if [ "$bytes" -lt 2000 ]; then
            echo "the answer was only $bytes bytes, that is not site-nav.js" >&2
            echo 'state=unreachable' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if diff -q "$ours" "$theirs" >/dev/null; then
            echo "identical, $bytes bytes"
            echo 'state=same' >> "$GITHUB_OUTPUT"
          else
            echo 'state=drifted' >> "$GITHUB_OUTPUT"
            {
              echo 'diff<<DIFF_EOF'
              diff -u "$ours" "$theirs" | head -60 || true
              echo 'DIFF_EOF'
            } >> "$GITHUB_OUTPUT"
            echo "drifted, ours $(wc -c < "$ours") bytes, theirs $bytes"
          fi

      - name: Say so, once
        if: steps.compare.outputs.state == 'drifted'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT: ${{ steps.compare.outputs.diff }}
        run: |
          set -euo pipefail
          title='The navigation has drifted from danielsolves.ai'

          # One issue, reopened and updated, rather than a fresh one every Monday.
          # Fifty-two identical issues a year is how a real one gets missed.
          existing=$(gh issue list --state all --search "$title in:title" \
                       --json number,state --jq '.[0].number // empty')

          body=$(printf '%s\n\n```diff\n%s\n```\n\n%s\n' \
            'ui/public/site-nav.js is a copy of the file danielsolves.ai serves, and the two no longer match. The demo is wearing a navigation the rest of the site has moved on from.' \
            "$DRIFT" \
            'To fix: copy the live file over ours and open a pull request. If ours is deliberately ahead, close this and it will reopen when the site catches up.')

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
            gh issue reopen "$existing" 2>/dev/null || true
            echo "updated issue #$existing"
          else
            gh issue create --title "$title" --body "$body" --label dependencies
          fi
