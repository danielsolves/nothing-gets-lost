# .github/dependabot.yml
#
# where: read by GitHub, opens pull requests against main.
# what: watch npm and the GitHub actions used by the workflows, weekly.
# why: the actions in ci.yml and deploy.yml are pinned to commit SHAs, which is the
#   point of the pin: a moving tag can be repointed at code nobody reviewed. A pin
#   without something to refresh it is only a slower kind of stale, so the two belong
#   together and neither is worth having alone.
#
# Weekly rather than daily. This repository has one maintainer, and a queue of
# dependency pull requests nobody reads is not safety, it is noise that trains you to
# ignore the label.
#
# Grouped rather than one pull request per package. Every one of these has to pass the
# same four required checks, including a ten thousand event soak run, so twelve small
# pull requests cost twelve full suites to review the same class of change once.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor together: these are the ones that are usually a glance and a
      # merge. Majors stay on their own, because they are the ones worth reading.
      routine:
        update-types: [minor, patch]
    # Two majors are parked rather than merged, and parked here rather than by
    # closing the pull request every Monday. A closed dependabot pull request comes
    # back the following week, so closing it is not a decision, it is a chore that
    # looks like one.
    #
    # React 19 fails 157 tests across six files. The shape of that is a changed
    # testing-library environment rather than 157 broken behaviours, so it is an
    # afternoon rather than a rewrite. It buys this demo nothing today.
    #
    # TypeScript 7 is the rewritten compiler. That is not an afternoon and it is not
    # something to walk into because a bot opened a pull request.
    #
    # Minor and patch still arrive for all of them, so a security fix inside the
    # current major still reaches us. What this gives up is a fix that exists only in
    # the next major, which for these two is worth reviewing by hand when it happens
    # rather than pre-empting weekly.
    ignore:
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react-dom'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
