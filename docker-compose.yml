# docker-compose.yml
# The one command: `docker compose up`. Only the database so far — the six
# services and the UI join in task 32, once they exist.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ngl
      POSTGRES_PASSWORD: ngl
      POSTGRES_DB: ngl
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ngl']
      interval: 3s
      retries: 20
