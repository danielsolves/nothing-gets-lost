# ui/nginx.conf
# How the built page reaches the api once there is no Vite dev server: same origin,
# three prefixes proxied to the api container. /oauth and /webhooks matter as much
# as /api — the OAuth callbacks and the Stripe webhook are api routes that arrive on
# the public url, and a page that only proxies /api breaks both of them.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types application/javascript text/css application/json image/svg+xml;
  gzip_min_length 1024;

  # Docker's embedded DNS, re-read every ten seconds. Without it nginx would pin
  # the api's address at startup and answer 502 for good once that container is
  # replaced with a new one on a different ip.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3001;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # /api/stream is an endless SSE response. Buffering it would hold every event
  # back until the connection closes, which is the one thing this page must not do.
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 1h;

  location /api/ { proxy_pass $api$request_uri; }
  location /oauth/ { proxy_pass $api$request_uri; }
  location /webhooks/ { proxy_pass $api$request_uri; }

  location /assets/ {
    # Vite fingerprints these filenames, so a stale copy is impossible.
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
