# ui/nginx.conf
# How the built page reaches everything else once there is no Vite dev server: same
# origin, four prefixes proxied on. Three go to the api container and one to the MCP
# server. /oauth and /webhooks matter as much as /api, because the OAuth callbacks and
# the Stripe webhook are api routes that arrive on the public url, and a page that
# only proxies /api breaks both of them.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types application/javascript text/css application/json image/svg+xml;
  gzip_min_length 1024;

  # Docker's embedded DNS, re-read every ten seconds. Without it nginx would pin
  # the api's address at startup and answer 502 for good once that container is
  # replaced with a new one on a different ip.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3001;
  set $mcp http://mcp:3007;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # /api/stream is an endless SSE response. Buffering it would hold every event
  # back until the connection closes, which is the one thing this page must not do.
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 1h;

  location /api/ { proxy_pass $api$request_uri; }
  location /oauth/ { proxy_pass $api$request_uri; }
  location /webhooks/ { proxy_pass $api$request_uri; }

  # The MCP server, on the same origin as the page.
  #
  # Only the outer nginx on the public host mapped this, so /mcp answered on
  # ngl.danielsolves.ai and 405d in every checkout. The panel that offers to run a
  # tool had to route its call through the api instead, and then say so in its own
  # copy: a panel whose whole purpose is that nothing of ours stands between the
  # reader and the answer, admitting that something does. Two lines here rather than
  # a hop there, and the address the panel prints is the address it calls, on the
  # public host and on a clone alike.
  #
  # The transport answers with an event stream, so it needs the proxy_buffering off
  # set above for the same reason /api/stream does: buffered, it arrives never.
  location /mcp { proxy_pass $mcp$request_uri; }

  location /assets/ {
    # Vite fingerprints these filenames, so a stale copy is impossible.
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
